eyebrow: Reference · Social Charter
title: Social Charter glossary
lede: "**The Social Charter** is a system of social organization designed to advance society to better states more efficiently than traditional democratic or autocratic structures."
intro: The terms appear in the order that the ideas build on each other. Start with the intent behind the Social Charter, the premises it responds to, and its principles. Then read about the building blocks, how they fit together, and how a charter acts, measures itself, and changes.
