title: Intellectual relatives
intro: The Social Charter doesn't claim to invent each of its parts. Its distinctive move is treating the charter as the universal constitutional primitive from which these structures are built recursively. The following traditions share important ideas with it.
traditions:
  - name: Guild socialism (G. D. H. Cole)
    ideas: Functional representation, membership in many associations, organized interest groups, and higher-level coordination
  - name: Syndicalism
    ideas: Functional organizations that hold real political and economic authority and govern themselves
  - name: Corporatism
    ideas: Representation through organized functional bodies coordinated by higher-order institutions
  - name: Associative democracy and pluralism
    ideas: Governance through autonomous associations and decentralized political authority
  - name: Polycentric governance (Elinor Ostrom)
    ideas: Nested institutions, many centers of authority, and local autonomy with higher-level coordination
  - name: Viable System Model (Stafford Beer)
    ideas: Recursive organizational autonomy and decentralized information with system-wide integration
  - name: Holacracy
    ideas: Constitutional authority, explicit domains, delegated roles, nested circles, and governance processes
  - name: Liquid democracy
    ideas: Issue-specific representation and delegable authority
  - name: Legal pluralism
    ideas: Many simultaneous authorities with overlapping jurisdictions
  - name: Capability approach (Amartya Sen, Martha Nussbaum)
    ideas: Welfare as real freedom to do and be what one values, judged by what resources make possible instead of by the resources themselves
  - name: DAO constitutionalism
    ideas: Digitally implemented constitutions with membership, delegation, and amendment systems
