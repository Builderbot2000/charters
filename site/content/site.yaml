eyebrow: Reference · Social Charter
title: Social Charter glossary
lede: "**The Social Charter** is a universal framework for organizing society. It models any part of society as a known problem, so that well-studied theory can organize it efficiently at any scale."
intro: "The glossary has four parts. The Framework is generic: it describes the structure that every charter shares, and takes no position on what society ought to be. The other three parts apply it to specific scenarios. The Model observes a specific society as it is, the Question asks what it ought to be, and the Answer sets out what is to be done. Within each part, the terms appear in the order that the ideas build on each other."
parts:
  - id: framework
    title: Framework
    intro: The generic structure that every charter shares. It models any part of society as a known problem, and takes no position on what society ought to be.
  - id: model
    title: Model
    intro: Observations of a specific society as it is.
  - id: question
    title: Question
    intro: What a specific society ought to be. These ideals and conditions become the Framework's parameters for that scenario.
  - id: answer
    title: Answer
    intro: What is to be done in a specific scenario.
